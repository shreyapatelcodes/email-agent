<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library - Knowledge Graph</title>
  <link rel="stylesheet" href="style.css">
  <script src="d3.min.js"></script>
</head>
<body>

<nav>
  <div class="logo">Library</div>
  <ul class="nav-links">
    <li><a href="index.html">Reading List</a></li>
    <li><a href="graph.html" class="active">Knowledge Graph</a></li>
  </ul>
</nav>

<div class="graph-container" id="graph-container">
  <div class="tooltip" id="tooltip"></div>
  <div class="graph-legend">
    <div class="legend-item"><div class="legend-dot topic"></div> Topic</div>
    <div class="legend-item"><div class="legend-dot article"></div> Article</div>
  </div>
</div>

<script src="data.js"></script>
<script>
const articles = (typeof LIBRARY_DATA !== 'undefined' && LIBRARY_DATA.articles) ? LIBRARY_DATA.articles : [];

function buildGraphData() {
  const nodes = [];
  const links = [];
  const topicSet = new Set();

  articles.forEach(a => (a.topics || []).forEach(t => topicSet.add(t)));

  topicSet.forEach(t => {
    const count = articles.filter(a => (a.topics || []).includes(t)).length;
    nodes.push({ id: 'topic:' + t, label: t, type: 'topic', count });
  });

  articles.forEach(a => {
    nodes.push({
      id: 'article:' + a.id,
      label: a.title || a.url,
      type: 'article',
      data: a,
    });
    (a.topics || []).forEach(t => {
      links.push({ source: 'article:' + a.id, target: 'topic:' + t, type: 'article_topic' });
    });
  });

  const topicArr = [...topicSet];
  for (let i = 0; i < topicArr.length; i++) {
    for (let j = i + 1; j < topicArr.length; j++) {
      const shared = articles.filter(a => {
        const t = a.topics || [];
        return t.includes(topicArr[i]) && t.includes(topicArr[j]);
      }).length;
      if (shared > 0) {
        links.push({
          source: 'topic:' + topicArr[i],
          target: 'topic:' + topicArr[j],
          type: 'topic_topic',
          weight: shared,
        });
      }
    }
  }

  return { nodes, links };
}

function renderGraph() {
  const container = document.getElementById('graph-container');
  const tooltip = document.getElementById('tooltip');
  const width = container.clientWidth;
  const height = container.clientHeight;

  const { nodes, links } = buildGraphData();

  if (nodes.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding-top: 20vh;">
        <h2>Your knowledge graph will appear here</h2>
        <p>Save articles with topics to see how your interests connect.</p>
      </div>`;
    return;
  }

  const svg = d3.select(container)
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  const g = svg.append('g');

  svg.call(d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => g.attr('transform', event.transform))
  );

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
      if (d.type === 'topic_topic') return 160;
      return 100;
    }))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'topic' ? -400 : -80))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.type === 'topic' ? 30 : 15));

  // Draw links
  const link = g.append('g')
    .selectAll('line')
    .data(links)
    .enter().append('line')
    .attr('stroke', d => d.type === 'topic_topic' ? '#ccc' : '#ddd')
    .attr('stroke-width', d => d.type === 'topic_topic' ? 0.75 : 0.5)
    .attr('stroke-dasharray', d => d.type === 'topic_topic' ? '3 3' : 'none');

  // Draw nodes
  const nodeG = g.append('g')
    .selectAll('g')
    .data(nodes)
    .enter().append('g')
    .style('cursor', 'pointer')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

  nodeG.append('circle')
    .attr('r', d => {
      if (d.type === 'topic') return 3.5 + (d.count || 1) * 1.2;
      return 3;
    })
    .attr('fill', d => d.type === 'topic' ? '#1a1a1a' : '#aaa')
    .attr('stroke', 'none');

  // Labels
  nodeG.append('text')
    .attr('dx', d => d.type === 'topic' ? 0 : 8)
    .attr('dy', d => d.type === 'topic' ? -(8 + (d.count || 1) * 1.2) : 3)
    .attr('text-anchor', d => d.type === 'topic' ? 'middle' : 'start')
    .attr('font-family', d => d.type === 'topic'
      ? "'Georgia', 'Times New Roman', serif"
      : "'Georgia', 'Times New Roman', serif")
    .attr('font-size', d => d.type === 'topic' ? '12px' : '9.5px')
    .attr('font-style', d => d.type === 'article' ? 'italic' : 'normal')
    .attr('fill', d => d.type === 'topic' ? '#1a1a1a' : '#999')
    .attr('letter-spacing', d => d.type === 'topic' ? '0.04em' : '0')
    .text(d => {
      const label = d.label;
      if (d.type === 'article') return label.length > 40 ? label.slice(0, 37) + '...' : label;
      return label;
    });

  // Hover effects
  nodeG.on('mouseover', function(event, d) {
    d3.select(this).select('circle')
      .transition().duration(150)
      .attr('r', d.type === 'topic' ? 5 + (d.count || 1) * 1.2 : 4.5);

    // Highlight connected links
    link.attr('stroke', l =>
      (l.source === d || l.target === d) ? '#1a1a1a' : (l.type === 'topic_topic' ? '#ccc' : '#ddd')
    ).attr('stroke-width', l =>
      (l.source === d || l.target === d) ? 1 : (l.type === 'topic_topic' ? 0.75 : 0.5)
    );

    if (d.type === 'article' && d.data) {
      const a = d.data;
      const meta = [a.author, a.source, a.date_saved].filter(Boolean).join(' · ');
      tooltip.innerHTML = `
        <h3>${a.title || a.url}</h3>
        <div class="meta">${meta}</div>
        ${a.summary ? `<div class="summary">${a.summary}</div>` : ''}
      `;
      tooltip.classList.add('visible');
    } else if (d.type === 'topic') {
      const topicArticles = articles.filter(a => (a.topics || []).includes(d.label));
      const titles = topicArticles.map(a => a.title || a.url).slice(0, 5);
      tooltip.innerHTML = `
        <h3>${d.label}</h3>
        <div class="meta">${topicArticles.length} article${topicArticles.length !== 1 ? 's' : ''}</div>
        <div class="summary">${titles.join('<br>')}</div>
      `;
      tooltip.classList.add('visible');
    }
  })
  .on('mousemove', (event) => {
    tooltip.style.left = (event.pageX + 15) + 'px';
    tooltip.style.top = (event.pageY - 10) + 'px';
  })
  .on('mouseout', function(event, d) {
    d3.select(this).select('circle')
      .transition().duration(150)
      .attr('r', d.type === 'topic' ? 3.5 + (d.count || 1) * 1.2 : 3);

    link.attr('stroke', l => l.type === 'topic_topic' ? '#ccc' : '#ddd')
      .attr('stroke-width', l => l.type === 'topic_topic' ? 0.75 : 0.5);

    tooltip.classList.remove('visible');
  })
  .on('click', (event, d) => {
    if (d.type === 'article' && d.data && d.data.url) {
      window.open(d.data.url, '_blank');
    }
  });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeG.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

renderGraph();
window.addEventListener('resize', () => {
  document.querySelector('#graph-container svg')?.remove();
  renderGraph();
});
</script>

</body>
</html>
