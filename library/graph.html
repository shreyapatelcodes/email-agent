<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library - Knowledge Graph</title>
  <link rel="stylesheet" href="style.css">
  <script src="d3.min.js"></script>
</head>
<body>

<nav>
  <div class="logo">Library</div>
  <ul class="nav-links">
    <li><a href="index.html">Reading List</a></li>
    <li><a href="graph.html" class="active">Knowledge Graph</a></li>
  </ul>
</nav>

<div class="graph-container" id="graph-container">
  <div class="tooltip" id="tooltip"></div>
  <div class="graph-legend">
    <div class="legend-item"><div class="legend-dot topic"></div> Topic</div>
    <div class="legend-item"><div class="legend-dot article"></div> Article</div>
  </div>
</div>

<script src="data.js"></script>
<script>
const articles = (typeof LIBRARY_DATA !== 'undefined' && LIBRARY_DATA.articles) ? LIBRARY_DATA.articles : [];

function buildGraphData() {
  const nodes = [];
  const links = [];
  const topicSet = new Set();

  articles.forEach(a => (a.topics || []).forEach(t => topicSet.add(t)));

  topicSet.forEach(t => {
    const count = articles.filter(a => (a.topics || []).includes(t)).length;
    nodes.push({ id: 'topic:' + t, label: t, type: 'topic', count });
  });

  articles.forEach(a => {
    nodes.push({
      id: 'article:' + a.id,
      label: a.title || a.url,
      type: 'article',
      data: a,
    });
    (a.topics || []).forEach(t => {
      links.push({ source: 'article:' + a.id, target: 'topic:' + t, type: 'article_topic' });
    });
  });

  // Topic-to-topic links based on shared articles
  const topicArr = [...topicSet];
  for (let i = 0; i < topicArr.length; i++) {
    for (let j = i + 1; j < topicArr.length; j++) {
      const shared = articles.filter(a => {
        const t = a.topics || [];
        return t.includes(topicArr[i]) && t.includes(topicArr[j]);
      }).length;
      if (shared > 0) {
        links.push({
          source: 'topic:' + topicArr[i],
          target: 'topic:' + topicArr[j],
          type: 'topic_topic',
          weight: shared,
        });
      }
    }
  }

  return { nodes, links };
}

function renderGraph() {
  const container = document.getElementById('graph-container');
  const tooltip = document.getElementById('tooltip');
  const width = container.clientWidth;
  const height = container.clientHeight;

  const { nodes, links } = buildGraphData();

  if (nodes.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="padding-top: 20vh;">
        <h2>Your knowledge graph will appear here</h2>
        <p>Save articles with topics to see how your interests connect.</p>
      </div>`;
    return;
  }

  const svg = d3.select(container)
    .append('svg')
    .attr('width', width)
    .attr('height', height);

  const g = svg.append('g');

  // Zoom
  svg.call(d3.zoom()
    .scaleExtent([0.2, 4])
    .on('zoom', (event) => g.attr('transform', event.transform))
  );

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => {
      if (d.type === 'topic_topic') return 120;
      return 80;
    }))
    .force('charge', d3.forceManyBody().strength(d => d.type === 'topic' ? -300 : -100))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(d => d.type === 'topic' ? 40 : 20));

  const link = g.append('g')
    .selectAll('line')
    .data(links)
    .enter().append('line')
    .attr('class', d => d.type === 'topic_topic' ? 'link link-topic' : 'link')
    .attr('stroke-width', d => d.type === 'topic_topic' ? (d.weight || 1) * 1.5 : 1);

  const nodeG = g.append('g')
    .selectAll('g')
    .data(nodes)
    .enter().append('g')
    .attr('class', d => d.type === 'topic' ? 'node-topic' : 'node-article')
    .call(d3.drag()
      .on('start', (event, d) => {
        if (!event.active) simulation.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => {
        if (!event.active) simulation.alphaTarget(0);
        d.fx = null; d.fy = null;
      })
    );

  nodeG.append('circle')
    .attr('r', d => {
      if (d.type === 'topic') return 8 + (d.count || 1) * 3;
      return 6;
    });

  nodeG.append('text')
    .attr('dx', d => d.type === 'topic' ? 0 : 10)
    .attr('dy', d => d.type === 'topic' ? -(12 + (d.count || 1) * 3) : 3)
    .attr('text-anchor', d => d.type === 'topic' ? 'middle' : 'start')
    .text(d => {
      const label = d.label;
      return label.length > 35 ? label.slice(0, 32) + '...' : label;
    });

  // Tooltip on hover
  nodeG.on('mouseover', (event, d) => {
    if (d.type === 'article' && d.data) {
      const a = d.data;
      const meta = [a.author, a.source, a.date_saved].filter(Boolean).join(' &middot; ');
      tooltip.innerHTML = `
        <h3>${a.title || a.url}</h3>
        <div class="meta">${meta}</div>
        ${a.summary ? `<div class="summary">${a.summary}</div>` : ''}
      `;
      tooltip.classList.add('visible');
    } else if (d.type === 'topic') {
      const count = articles.filter(a => (a.topics || []).includes(d.label)).length;
      tooltip.innerHTML = `<h3>${d.label}</h3><div class="meta">${count} article${count !== 1 ? 's' : ''}</div>`;
      tooltip.classList.add('visible');
    }
  })
  .on('mousemove', (event) => {
    tooltip.style.left = (event.pageX + 15) + 'px';
    tooltip.style.top = (event.pageY - 10) + 'px';
  })
  .on('mouseout', () => tooltip.classList.remove('visible'))
  .on('click', (event, d) => {
    if (d.type === 'article' && d.data && d.data.url) {
      window.open(d.data.url, '_blank');
    }
  });

  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeG.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

renderGraph();
window.addEventListener('resize', () => {
  document.querySelector('#graph-container svg')?.remove();
  renderGraph();
});
</script>

</body>
</html>
